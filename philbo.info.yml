name: Philbo
type: theme
description: 'A flexible custom theme with many regions.'
alt text: "Screenshot of Philbo theme."
package: Philbo
base theme: false
version: VERSION
core_version_requirement: ^10.2 || ^11.2
screenshot: screenshot.png

regions:
  page_top: 'Page (top)'
  header: 'Header'
  menu: 'Menu (primary)'
  menu_secondary: 'Menu (secondary)'
  content_above: 'Content (above)'
  content: 'Content'
  content_below: 'Content (below)'
  sidebar_first: 'Sidebar (first)'
  sidebar_second: 'Sidebar (second)'
  footer_upper: 'Footer (upper)'
  footer_one: 'Footer (one)'
  footer_two: 'Footer (two)'
  footer_three: 'Footer (three)'
  footer_four: 'Footer (four)'
  footer_below: 'Footer (below)'
  page_bottom: 'Page bottom'

regions_hidden: false

libraries: false

libraries-override: false

libraries-extend: false

ckeditor5-stylesheets: false

stylesheets-remove: false

features:
  - logo
  - name
  - favicon
  - primary_navigation
  - secondary_navigation
  - slogan
  - node_user_picture
  - comment_user_picture
  - comment_user_verification

shortcut_module_link: false
philbo_breadcrumb: true
philbo_breadcrumb_separator: ' › '
philbo_breadcrumb_home: true
philbo_breadcrumb_trailing: false
philbo_breadcrumb_title: false
philbo_skip_link_anchor: 'main-menu'
philbo_skip_link_text: 'Jump to navigation'
